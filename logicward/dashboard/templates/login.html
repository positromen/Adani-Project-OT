<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogicWard — Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark"><span></span></span>
      <div>
        <div class="brand-name">LogicWard</div>
        <div class="brand-sub">OT Drift-Detection Appliance</div>
      </div>
    </div>
    <form method="post" class="login-form">
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <label>Username<input name="username" autocomplete="username" autofocus required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <div class="login-hint">
      operator / operator123 &nbsp;·&nbsp; engineer / engineer123 &nbsp;·&nbsp; soc / soc123
    </div>
  </div>
</body>
</html>
